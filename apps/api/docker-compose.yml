name: ba-agent-platform
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ba_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run db:setup first}
      POSTGRES_DB: ba_agent
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ba_dev -d ba_agent"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
